[tool.black]
line-length = 120
target-version = ['py38']
skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["F821"]